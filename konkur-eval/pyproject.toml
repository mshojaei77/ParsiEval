[project]
name = "konkur-eval"
version = "0.1.0"
description = "Evaluate language and multimodal models on the Persian Konkur 1404 benchmark."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.0.0",
    "gradio>=5.0.0",
    "huggingface-hub>=0.20.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[tool.uv]
package = false

